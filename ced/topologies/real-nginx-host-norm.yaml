# 客户拓扑：真实 nginx 前置 → CED 探针（host-norm 领域）
#
# 观测对象：真实 nginx 转发出去的 Host 头（proxy_set_header Host $host 会做
# 它自己的归一化）—— 探针按 host-norm 的 ``extract`` 取出 Host，
# 与进程内参照实现比"这个请求认成哪个虚拟主机"。
#
# 跑起来：
#   ① 起栈：  CED_DOMAIN=host-norm CED_POLICY=host-literal \
#              docker compose -f docker/docker-compose.yml up -d --build probe front
#   ② 跑扫描：python -m ced scan --topology ced/topologies/real-nginx-host-norm.yaml \
#                                --limit 12 --out results/real-host.md
#   ③ 收工：  docker compose -f docker/docker-compose.yml down

domain: host-norm

impls:
  - id: customer-gateway
    name: customer-gateway (nginx)
    version: "1.25"
    role: front
    runner: chain
    endpoint: 127.0.0.1:8080
    probe_api: 127.0.0.1:8801
    image: nginx:1.25-alpine
    notes: "真实 nginx 前置：观测它转发出去的 Host。"

  - id: host-literal
    role: back
    runner: local
    policy: host-literal

  - id: host-strip-dot
    role: back
    runner: local
    policy: host-strip-dot

  - id: host-lowercase
    role: back
    runner: local
    policy: host-lowercase

chain: [customer-gateway, host-literal]
